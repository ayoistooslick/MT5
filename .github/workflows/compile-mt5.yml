name: Compile MT5 EA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    env:
      MT5_INSTALL_DIR: C:\MT5

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Download MetaTrader 5
      # ---------------------------------------------------------
      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5..."
          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
              Write-Error "MetaTrader 5 installer was not downloaded."
              exit 1
          }

          Write-Host "Installer downloaded successfully."
          Write-Host "Installer: $installer"

      # ---------------------------------------------------------
      # 3. Install MetaTrader 5
      # ---------------------------------------------------------
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Installing MetaTrader 5..."
          Write-Host "Install directory: $env:MT5_INSTALL_DIR"

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto", "/path:`"$env:MT5_INSTALL_DIR`"" `
            -Wait `
            -NoNewWindow

          Start-Sleep -Seconds 5

          if (!(Test-Path $env:MT5_INSTALL_DIR)) {
              Write-Error "MetaTrader 5 installation directory was not created."
              exit 1
          }

          Write-Host "MetaTrader 5 installation completed."

      # ---------------------------------------------------------
      # 4. Find MetaEditor
      # ---------------------------------------------------------
      - name: Find MetaEditor
        shell: pwsh
        run: |
          Write-Host "Searching for MetaEditor..."

          $locations = @(
              "$env:MT5_INSTALL_DIR",
              "C:\Program Files\MetaTrader 5",
              "C:\Program Files (x86)\MetaTrader 5",
              "C:\Program Files",
              "C:\Program Files (x86)"
          )

          $metaEditor = $null

          foreach ($location in $locations) {
              if (Test-Path $location) {
                  Write-Host "Searching: $location"

                  $found = Get-ChildItem `
                    -Path $location `
                    -Filter "MetaEditor64.exe" `
                    -Recurse `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($found) {
                      $metaEditor = $found.FullName
                      break
                  }
              }
          }

          if (!$metaEditor) {
              Write-Host "MetaEditor64.exe not found."
              Write-Host "Searching entire C:\ drive as fallback..."

              $found = Get-ChildItem `
                -Path "C:\" `
                -Filter "MetaEditor64.exe" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                  $metaEditor = $found.FullName
              }
          }

          if (!$metaEditor) {
              Write-Error "MetaEditor64.exe could not be found."
              exit 1
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

          # Make it available to subsequent workflow steps.
          "METAEDITOR=$metaEditor" >> $env:GITHUB_ENV

      # ---------------------------------------------------------
      # 5. Verify MetaEditor
      # ---------------------------------------------------------
      - name: Verify MetaEditor
        shell: pwsh
        run: |
          if (!$env:METAEDITOR) {
              Write-Error "METAEDITOR environment variable is empty."
              exit 1
          }

          if (!(Test-Path $env:METAEDITOR)) {
              Write-Error "MetaEditor does not exist at:"
              Write-Error $env:METAEDITOR
              exit 1
          }

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host ""
          Write-Host "MetaEditor version information:"

          $version = (Get-Item $env:METAEDITOR).VersionInfo

          Write-Host "Product: $($version.ProductName)"
          Write-Host "Version: $($version.ProductVersion)"

      # ---------------------------------------------------------
      # 6. Compile EA
      # ---------------------------------------------------------
      - name: Compile EA
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "EA.mq5"

          Write-Host "========================================"
          Write-Host "MT5 EA COMPILATION"
          Write-Host "========================================"
          Write-Host "Source:"
          Write-Host $source
          Write-Host ""
          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR
          Write-Host "========================================"

          if (!(Test-Path $source)) {
              Write-Error "EA.mq5 was not found:"
              Write-Error $source
              exit 1
          }

          Write-Host ""
          Write-Host "Repository files:"
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          Write-Host ""
          Write-Host "Starting MetaEditor compiler..."

          & $env:METAEDITOR `
            "/compile:$source" `
            "/log"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "MetaEditor exit code: $exitCode"

          # MetaEditor creates EA.log beside EA.mq5.
          $log = Join-Path $env:GITHUB_WORKSPACE "EA.log"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "COMPILATION LOG"
          Write-Host "========================================"

          if (Test-Path $log) {
              Get-Content $log
          }
          else {
              Write-Host "EA.log was not found beside EA.mq5."

              Write-Host ""
              Write-Host "Searching for .log files..."

              $logs = Get-ChildItem `
                -Path $env:GITHUB_WORKSPACE `
                -Filter "*.log" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue

              if ($logs.Count -eq 0) {
                  Write-Host "No compilation logs found."
              }
              else {
                  foreach ($file in $logs) {
                      Write-Host ""
                      Write-Host "---------- $($file.FullName) ----------"
                      Get-Content $file.FullName
                  }
              }
          }

          Write-Host ""
          Write-Host "========================================"

          # Check whether EX5 was generated.
          $ex5 = Join-Path $env:GITHUB_WORKSPACE "EA.ex5"

          if (Test-Path $ex5) {
              Write-Host "EA.ex5 was created successfully."
              Write-Host "EX5 path: $ex5"
          }
          else {
              Write-Host "EA.ex5 was NOT created."
          }

          if ($exitCode -ne 0) {
              Write-Error "MetaEditor compilation failed."
              exit $exitCode
          }

          if (!(Test-Path $ex5)) {
              Write-Error "Compilation reported success but EA.ex5 was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Compilation completed successfully."

      # ---------------------------------------------------------
      # 7. Upload compiler output
      # ---------------------------------------------------------
      - name: Upload compilation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT5-compiled-EA
          path: |
            EA.mq5
            EA.ex5
            EA.log
          if-no-files-found: warn

      # ---------------------------------------------------------
      # 8. GitHub Actions summary
      # ---------------------------------------------------------
      - name: Compilation summary
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL COMPILATION SUMMARY"
          Write-Host "========================================"

          if (Test-Path "$env:GITHUB_WORKSPACE\EA.ex5") {
              Write-Host "STATUS: EA.ex5 exists"
              Write-Host "The EA was compiled."
          }
          else {
              Write-Host "STATUS: EA.ex5 does not exist"
              Write-Host "The EA was not compiled successfully."
          }

          Write-Host "========================================"