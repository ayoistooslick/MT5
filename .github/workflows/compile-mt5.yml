name: Compile MT5 EA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest

    env:
      MT5_DIR: C:\MT5
      EA_NAME: EA

    steps:
      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Download MetaTrader 5
      # ==========================================================
      - name: Download MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5..."

          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
              Write-Error "MetaTrader 5 installer was not downloaded."
              exit 1
          }

          Write-Host "Download complete."

      # ==========================================================
      # 3. Install MetaTrader 5
      # ==========================================================
      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Installing MetaTrader 5..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto", "/path:`"$env:MT5_DIR`"" `
            -Wait `
            -NoNewWindow

          Start-Sleep -Seconds 5

          if (!(Test-Path $env:MT5_DIR)) {
              Write-Error "MT5 installation directory was not created."
              exit 1
          }

          Write-Host "MT5 installed at:"
          Write-Host $env:MT5_DIR

      # ==========================================================
      # 4. Find MetaEditor
      # ==========================================================
      - name: Find MetaEditor
        shell: pwsh
        run: |
          Write-Host "Searching for MetaEditor64.exe..."

          $metaEditor = Get-ChildItem `
            -Path $env:MT5_DIR `
            -Filter "MetaEditor64.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$metaEditor) {
              Write-Host "MetaEditor not found inside MT5 directory."
              Write-Host "Searching Program Files..."

              $metaEditor = Get-ChildItem `
                -Path "C:\Program Files","C:\Program Files (x86)" `
                -Filter "MetaEditor64.exe" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
          }

          if (!$metaEditor) {
              Write-Error "MetaEditor64.exe could not be found."
              exit 1
          }

          Write-Host ""
          Write-Host "MetaEditor found:"
          Write-Host $metaEditor.FullName

          "METAEDITOR=$($metaEditor.FullName)" >> $env:GITHUB_ENV

      # ==========================================================
      # 5. Verify MetaEditor
      # ==========================================================
      - name: Verify MetaEditor
        shell: pwsh
        run: |
          if (!$env:METAEDITOR) {
              Write-Error "METAEDITOR environment variable is empty."
              exit 1
          }

          if (!(Test-Path $env:METAEDITOR)) {
              Write-Error "MetaEditor does not exist:"
              Write-Error $env:METAEDITOR
              exit 1
          }

          $version = (Get-Item $env:METAEDITOR).VersionInfo

          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR

          Write-Host ""
          Write-Host "Version:"
          Write-Host $version.ProductVersion

      # ==========================================================
      # 6. Create proper MQL5 workspace
      # ==========================================================
      - name: Prepare MQL5 workspace
        shell: pwsh
        run: |
          $mql5 = Join-Path $env:MT5_DIR "MQL5"
          $experts = Join-Path $mql5 "Experts"
          $project = Join-Path $experts $env:EA_NAME

          Write-Host "Creating MQL5 workspace..."

          New-Item -ItemType Directory -Force -Path $mql5 | Out-Null
          New-Item -ItemType Directory -Force -Path $experts | Out-Null
          New-Item -ItemType Directory -Force -Path $project | Out-Null

          # Copy the EA
          Copy-Item `
            "$env:GITHUB_WORKSPACE\EA.mq5" `
            "$project\EA.mq5" `
            -Force

          # Copy Include directory
          if (Test-Path "$env:GITHUB_WORKSPACE\Include") {
              Copy-Item `
                "$env:GITHUB_WORKSPACE\Include" `
                "$project\Include" `
                -Recurse `
                -Force
          }
          else {
              Write-Error "Include directory was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "MQL5 workspace:"
          Write-Host $project

          Write-Host ""
          Write-Host "Workspace files:"

          Get-ChildItem `
            $project `
            -Recurse `
            -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

          "MQL5_ROOT=$mql5" >> $env:GITHUB_ENV
          "EA_PROJECT=$project" >> $env:GITHUB_ENV

      # ==========================================================
      # 7. Install the MQL5 Standard Library Trade classes
      # ==========================================================
      - name: Install MQL5 Standard Library Trade classes
        shell: pwsh
        run: |
          $include = Join-Path $env:MT5_DIR "MQL5\Include"
          $trade = Join-Path $include "Trade"
          $revision = "d913f3880a6120e7f8d276b97e819c3e7d97e95b"
          $baseUrl = "https://raw.githubusercontent.com/gsemet/mt5-include/$revision"

          # The terminal image used by this runner does not ship with the
          # MetaQuotes MQL5 Standard Library. Download the unmodified
          # Standard Library files needed by the Trade classes into the
          # location searched by #include <Trade/Trade.mqh>.
          $files = @(
              @{ Relative = "Object.mqh"; Destination = $include },
              @{ Relative = "StdLibErr.mqh"; Destination = $include },
              @{ Relative = "Trade/AccountInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/DealInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/HistoryOrderInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/OrderInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/PositionInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/SymbolInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/TerminalInfo.mqh"; Destination = $trade },
              @{ Relative = "Trade/Trade.mqh"; Destination = $trade }
          )

          New-Item -ItemType Directory -Force -Path $trade | Out-Null

          foreach ($file in $files) {
              $destination = Join-Path $file.Destination (Split-Path $file.Relative -Leaf)
              $url = "$baseUrl/$($file.Relative)"

              Write-Host "Downloading $($file.Relative)..."
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $destination `
                -UseBasicParsing

              if (!(Test-Path $destination) -or (Get-Item $destination).Length -eq 0) {
                  Write-Error "Failed to install $($file.Relative)."
                  exit 1
              }
          }

          $tradeHeader = Join-Path $trade "Trade.mqh"
          if (!(Test-Path $tradeHeader)) {
              Write-Error "MQL5 Standard Library header is missing: $tradeHeader"
              exit 1
          }

          $tradeSource = Get-Content $tradeHeader -Raw
          $functionStart = $tradeSource.IndexOf("bool CTrade::IsStopped(const string function)")

          if ($functionStart -lt 0) {
              Write-Error "CTrade::IsStopped function was not found in Trade.mqh."
              exit 1
          }

          $functionEnd = $tradeSource.IndexOf("bool CTrade::Buy", $functionStart)

          if ($functionEnd -lt 0) {
              Write-Error "CTrade::Buy function was not found after CTrade::IsStopped in Trade.mqh."
              exit 1
          }

          $isStoppedFunction = $tradeSource.Substring(
              $functionStart,
              $functionEnd - $functionStart
          )

          if (!$isStoppedFunction.Contains("if(!IsStopped())")) {
              Write-Error "Expected unqualified IsStopped() call was not found in CTrade::IsStopped."
              exit 1
          }

          $isStoppedFunction = $isStoppedFunction.Replace(
              "if(!IsStopped())",
              "if(!::IsStopped())"
          )

          $tradeSource = $tradeSource.Substring(0, $functionStart) +
              $isStoppedFunction +
              $tradeSource.Substring($functionEnd)

          Set-Content `
            -Path $tradeHeader `
            -Value $tradeSource `
            -Encoding UTF8

          Write-Host "Patched CTrade::IsStopped to call the global ::IsStopped()."
          Write-Host "Installed MQL5 Standard Library Trade classes:"
          Get-ChildItem $trade -File | ForEach-Object {
              Write-Host $_.FullName
          }

      # ==========================================================
      # 8. Verify patched Standard Library Trade classes
      # ==========================================================
      - name: Verify patched Standard Library Trade classes
        shell: pwsh
        run: |
          $tradeHeader = Join-Path $env:MT5_DIR "MQL5\Include\Trade\Trade.mqh"

          if (!(Test-Path $tradeHeader)) {
              Write-Error "Trade.mqh is missing: $tradeHeader"
              exit 1
          }

          $tradeSource = Get-Content $tradeHeader -Raw
          $functionStart = $tradeSource.IndexOf("bool CTrade::IsStopped(const string function)")

          if ($functionStart -lt 0) {
              Write-Error "CTrade::IsStopped function was not found in Trade.mqh."
              exit 1
          }

          $functionEnd = $tradeSource.IndexOf("bool CTrade::Buy", $functionStart)

          if ($functionEnd -lt 0) {
              Write-Error "CTrade::Buy function was not found after CTrade::IsStopped in Trade.mqh."
              exit 1
          }

          $isStoppedFunction = $tradeSource.Substring(
              $functionStart,
              $functionEnd - $functionStart
          )

          if (!$isStoppedFunction.Contains("if(!::IsStopped())")) {
              Write-Error "Trade.mqh does not contain the corrected global ::IsStopped() call."
              exit 1
          }

          Write-Host "Verified corrected call in Trade.mqh:"
          $isStoppedFunction -split "`r?`n" |
            Where-Object { $_ -match "IsStopped" } |
            ForEach-Object { Write-Host $_ }

      # ==========================================================
      # 9. Compile EA
      # ==========================================================
      - name: Compile EA
        shell: pwsh
        run: |
          $source = Join-Path $env:EA_PROJECT "EA.mq5"
          $log = Join-Path $env:EA_PROJECT "EA.log"
          $ex5 = Join-Path $env:EA_PROJECT "EA.ex5"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "MT5 EA COMPILATION"
          Write-Host "=============================================="
          Write-Host "MetaEditor:"
          Write-Host $env:METAEDITOR
          Write-Host ""
          Write-Host "Source:"
          Write-Host $source
          Write-Host ""
          Write-Host "MQL5 root:"
          Write-Host $env:MQL5_ROOT
          Write-Host "=============================================="

          if (!(Test-Path $source)) {
              Write-Error "EA.mq5 does not exist."
              exit 1
          }

          # Remove old output if present
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Remove-Item $ex5 -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Running MetaEditor..."

          # Use cmd.exe so Windows handles the MetaEditor
          # command-line invocation exactly like a normal
          # Windows command.
          $arguments = "/portable /compile:`"$source`" /include:`"$env:MQL5_ROOT`" /log"

          Write-Host ""
          Write-Host "Arguments:"
          Write-Host $arguments
          Write-Host ""

          $process = Start-Process `
            -FilePath $env:METAEDITOR `
            -ArgumentList $arguments `
            -WorkingDirectory $env:MT5_DIR `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "MetaEditor process exit code:"
          Write-Host $process.ExitCode

          # Give MetaEditor a moment to finish writing the log.
          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "COMPILATION LOG"
          Write-Host "=============================================="

          if (Test-Path $log) {
              Write-Host ""
              Get-Content $log
          }
          else {
              Write-Host "EA.log was not created at:"
              Write-Host $log

              Write-Host ""
              Write-Host "Searching entire MT5 directory for logs..."

              $logs = Get-ChildItem `
                $env:MT5_DIR `
                -Filter "*.log" `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue

              if ($logs) {
                  foreach ($file in $logs) {
                      Write-Host ""
                      Write-Host "---------- $($file.FullName) ----------"
                      Get-Content $file.FullName
                  }
              }
              else {
                  Write-Host "No log files were found."
              }
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "OUTPUT CHECK"
          Write-Host "=============================================="

          if (Test-Path $ex5) {
              Write-Host ""
              Write-Host "SUCCESS"
              Write-Host "EA.ex5 was created:"
              Write-Host $ex5
          }
          else {
              Write-Host ""
              Write-Host "EA.ex5 was NOT created."
          }

          # Do not rely only on MetaEditor's process exit code.
          # The actual EX5 file is the important compilation result.
          if (!(Test-Path $ex5)) {
              Write-Error "EA.ex5 was not produced. Compilation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "EA compiled successfully."

      # ==========================================================
      # 10. Copy compiled EA back to workspace
      # ==========================================================
      - name: Collect compiled EA
        if: always()
        shell: pwsh
        run: |
          $ex5 = Join-Path $env:EA_PROJECT "EA.ex5"
          $log = Join-Path $env:EA_PROJECT "EA.log"

          if (Test-Path $ex5) {
              Copy-Item `
                $ex5 `
                "$env:GITHUB_WORKSPACE\EA.ex5" `
                -Force

              Write-Host "Copied EA.ex5 to repository workspace."
          }

          if (Test-Path $log) {
              Copy-Item `
                $log `
                "$env:GITHUB_WORKSPACE\EA.log" `
                -Force

              Write-Host "Copied EA.log to repository workspace."
          }

      # ==========================================================
      # 11. Upload compiled EA + log
      # ==========================================================
      - name: Upload compilation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT5-compiled-EA
          path: |
            EA.ex5
            EA.log
          if-no-files-found: warn

      # ==========================================================
      # 12. Final summary
      # ==========================================================
      - name: Compilation summary
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "FINAL SUMMARY"
          Write-Host "=============================================="

          if (Test-Path "$env:GITHUB_WORKSPACE\EA.ex5") {
              Write-Host "COMPILED: YES"
              Write-Host "EA.ex5 is available."
          }
          else {
              Write-Host "COMPILED: NO"
              Write-Host "EA.ex5 was not produced."
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\EA.log") {
              Write-Host "LOG: YES"
              Write-Host "EA.log is available."
          }
          else {
              Write-Host "LOG: NO"
          }

          Write-Host "=============================================="
